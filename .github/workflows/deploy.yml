name: Deploy Backend & ApiGateway to AWS EC2

on:
  push:
    branches: [ "develop", "Develop" ]
  workflow_dispatch: # Cho phép trigger deploy thủ công trên giao diện GitHub

jobs:
  test-and-build:
    name: 1. CI - Verify & Test Solution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore TaxKeepVNManagement.sln

      - name: Build project (Release)
        run: dotnet build TaxKeepVNManagement.sln --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test TaxKeepVNManagement.sln --configuration Release --no-build --verbosity normal

  deploy:
    name: 2. CD - Build Docker Images & Deploy to EC2
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Images (Backend & Gateway)
        run: |
          docker build -t taxkeep-backend:latest -f Dockerfile .
          docker build -t taxkeep-gateway:latest -f Dockerfile.gateway .
          docker save taxkeep-backend:latest taxkeep-gateway:latest | gzip > backend_and_gateway.tar.gz

      - name: Copy Docker Images to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend_and_gateway.tar.gz"
          target: "~/taxkeep/"

      - name: Deploy Containers on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/taxkeep
            docker load < backend_and_gateway.tar.gz
            rm -f backend_and_gateway.tar.gz
            docker compose up -d backend gateway
            docker image prune -f
