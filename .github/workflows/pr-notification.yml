name: PR & Merge Team Notification

on:
  pull_request:
    types: [opened, closed]

jobs:
  notify:
    name: Send Email Notification
    runs-on: ubuntu-latest

    steps:
      # 1. GỬI MAIL KHI CÓ PULL REQUEST MỚI (NHẮC DUYỆT / APPROVE)
      - name: Gửi mail nhắc nhở Review & Approval
        if: github.event.action == 'opened'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: vovancuong1208@gmail.com
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[TaxKeep VN] 🔔 Có Pull Request mới cần duyệt: ${{ github.event.pull_request.title }}"
          # Điền danh sách các email nhận thông báo ở đây (cách nhau bằng dấu phẩy)
          to: vovancuong1208@gmail.com
          from: "TaxKeep VN Bot <vovancuong1208@gmail.com>"
          html_body: |
            <div style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; border: 1px solid #e1e4e8; border-radius: 8px; padding: 20px;">
              <h2 style="color: #0366d6; margin-top: 0;">🔔 Thông báo Pull Request mới</h2>
              <p>Xin chào mọi người,</p>
              <p>Thành viên <b>${{ github.actor }}</b> vừa tạo một Pull Request mới:</p>
              <div style="background-color: #f6f8fa; padding: 12px 16px; border-left: 4px solid #0366d6; margin: 15px 0;">
                <p style="margin: 0; font-size: 16px; font-weight: bold;">${{ github.event.pull_request.title }}</p>
                <p style="margin: 5px 0 0 0; color: #586069; font-size: 13px;">Nhánh: <code>${{ github.head_ref }}</code> &rarr; <code>${{ github.base_ref }}</code></p>
              </div>
              <p>Mọi người vui lòng vào kiểm tra code và bấm <b>Approve</b> để hỗ trợ gộp code vào dự án nhé:</p>
              <p style="text-align: center; margin: 25px 0;">
                <a href="${{ github.event.pull_request.html_url }}" style="background-color: #2ea44f; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold; display: inline-block;">👉 Xem Pull Request & Approve</a>
              </p>
              <hr style="border: none; border-top: 1px solid #e1e4e8; margin: 20px 0;">
              <p style="font-size: 12px; color: #6a737d; text-align: center;">Email tự động gửi từ GitHub Actions của dự án TaxKeep VN Management.</p>
            </div>

      # 2. GỬI MAIL KHI PULL REQUEST ĐƯỢC MERGE THÀNH CÔNG
      - name: Gửi mail thông báo PR đã được Merge
        if: github.event.action == 'closed' && github.event.pull_request.merged == true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: vovancuong1208@gmail.com
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[TaxKeep VN] 🚀 Code đã được MERGE thành công: ${{ github.event.pull_request.title }}"
          # Điền danh sách các email nhận thông báo ở đây (cách nhau bằng dấu phẩy)
          to: vovancuong1208@gmail.com
          from: "TaxKeep VN Bot <vovancuong1208@gmail.com>"
          html_body: |
            <div style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; border: 1px solid #e1e4e8; border-radius: 8px; padding: 20px;">
              <h2 style="color: #28a745; margin-top: 0;">🎉 Code đã được gộp (Merged) thành công!</h2>
              <p>Xin chào mọi người,</p>
              <p>Pull Request <b>"${{ github.event.pull_request.title }}"</b> đã được gộp vào nhánh <b>${{ github.base_ref }}</b> bởi <b>${{ github.actor }}</b>.</p>
              <div style="background-color: #f6f8fa; padding: 15px; border-radius: 6px; margin: 15px 0;">
                <p style="margin: 0; font-weight: bold; color: #24292e;">⚡ Lưu ý cho cả nhóm:</p>
                <p style="margin: 5px 0 0 0; color: #586069;">Hãy mở terminal và chạy lệnh sau để cập nhật code mới nhất về máy nhé:</p>
                <pre style="background: #e1e4e8; padding: 8px 12px; border-radius: 4px; font-size: 14px; margin-top: 8px;">git pull origin ${{ github.base_ref }}</pre>
              </div>
              <p style="text-align: center; margin: 25px 0;">
                <a href="${{ github.event.pull_request.html_url }}" style="color: #0366d6; text-decoration: underline;">Xem chi tiết Pull Request đã merge</a>
              </p>
              <hr style="border: none; border-top: 1px solid #e1e4e8; margin: 20px 0;">
              <p style="font-size: 12px; color: #6a737d; text-align: center;">Email tự động gửi từ GitHub Actions của dự án TaxKeep VN Management.</p>
            </div>
